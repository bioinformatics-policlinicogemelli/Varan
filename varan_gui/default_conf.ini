; Varan settings used by the Varan app. To change filters, thresholds or
; cBioPortal headers, save a copy ("Make a conf.ini to edit..." in Settings),
; edit it and choose it as "Own conf.ini": its values replace these.
; [Paths] is filled in by the app (the tools inside the Docker image, and
; the VEP cache and FASTA chosen in Settings).

[Paths]
VCF2MAF = /mskcc-vcf2maf/vcf2maf.pl
CLINV = /clinvar/clinvar.vcf.gz,ClinVar,vcf,exact,0,CLNSIG
REF_FASTA =
VEP_PATH = /opt/vep/src/ensembl-vep
VEP_DATA =
CACHE = 116
RSCRIPT = Rscript

[Vendor]
; Set by the app ("Pipeline").
PIPELINE =

[Sample_Type]
; Solid or Liquid - set by the app ("Sample type").
TYPE = Solid

[Multiple]
SNV =
CNV =
COMBOUT =

[Zip]
ZIP_MAF = True
ZIP_SNV_FILTERED = True
COPY_MAF = True

[OncoKB]
; Set by the app (token in Settings).
ONCOKB =

[Project]
PROJECT_ID =
PROJECT_NAME =
DESCRIPTION = 'Comprehensive profiling of cancer samples'
PROFILE_MUT = "Sequencing of tumor"
PROFILE_CNA =
PROFILE_CNA_HG19 = "Somatic CNA data"
PROFILE_SV =

[Filters]
t_VAF_min = 0.05
t_VAF_max = 1
t_VAF_min_novel = 0.05
VAF_EXCLUDE_BANDS = []
AF = <0.0004
drop_NA_AF = False
ONCOKB_FILTER_SNV = ["Likely Oncogenic","Oncogenic"]
CLIN_SIG = ["benign", "likely_benign", "benign/likely_benign"]
CONSEQUENCES = ["splice_region_variant", "frameshift_variant", "splice_donor_variant", "stop_gained", "splice_acceptor_variant", "start_lost","inframe_insertion", "inframe_deletion"]
POLYPHEN = ["damaging"]
IMPACT = ["LOW", "MODIFIER"]
SIFT = ["tolerated"]

[Cna]
PLOIDY = 2
CNVKIT_algorithm = True
ONCOKB_FILTER_CNV = ["Likely Oncogenic","Oncogenic"]

[TMB]
THRESHOLD_TMB = {'Low':'<=5','Medium':'<10','High':'>=10'}

[MSI]
THRESHOLD_SITES = >=40
THRESHOLD_MSI = <20
THRESHOLD_MSI_LIQUID = 0.05

[FUSION]
THRESHOLD_FUSION = >=15
ONCOKB_FILTER_FUSION = ["Likely Oncogenic","Oncogenic"]

[SPLICE]
THRESHOLD_SPLICE = >=15

[ClinicalSample]
HEADER_SAMPLE_SHORT =
HEADER_SAMPLE_LONG =
HEADER_SAMPLE_TYPE =

[ClinicalPatient]
HEADER_PATIENT_SHORT =
HEADER_PATIENT_LONG =
HEADER_PATIENT_TYPE =

[Annotations]
ANNOTATIONS = []

[SigMA]
; Used only with "SigMA mutational signatures" on.
VAF_MIN = 0.0
VAF_EXCLUDE_BANDS = [[0.45, 0.55], [0.90, 1.0]]
DATA_PLATFORM = msk
CHECK_MSI = False
SNV_CUTOFF = 5
TUMOR_TYPE_OVERRIDE =
FALLBACK_TO_OTHER = True
COSMIC_VERSION = v2
LITE_FORMAT = True
SIGNATURE3_POSITIVE_THRESHOLD = default
