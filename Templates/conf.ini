[Annotations]
ANNOTATIONS =

[CH]
; Flags plasma variants that may come from clonal hematopoiesis (white
; blood cell clones, not the tumor) - see clonal_hematopoiesis.py. Plasma
; samples only; variants are flagged in data_mutations_extended.txt
; (CH.EVIDENCE, CH.REASON), never removed. Without sequencing of matched
; white blood cells (sample.tsv's optional wbc_path column, a VCF) the
; origin can't be confirmed: research use only.
ENABLED = True
; Genes/variants typical of clonal hematopoiesis (tier 1) or shared with
; tumors (tier 2), with their sources. Relative to Varan's folder.
GENE_LIST = ch_genes.tsv
; A tier 2 variant counts as "CH suspected" (instead of "CH compatible")
; when its VAF is below this fraction of the highest VAF among the
; sample's variants in genes outside GENE_LIST - or with the next one.
; Heuristics, not validated against white blood cell sequencing.
RELATIVE_VAF_MAX = 0.25
; ...or when, across the patient's plasma samples, its VAF changes less
; than SERIAL_FOLD times while their tumor VAF changes at least as much.
SERIAL_FOLD = 2
; True: suspected/confirmed CH variants are left out of SigMA's input.
EXCLUDE_FROM_DOWNSTREAM = False

[Serial]
; Serial ctDNA: plasma samples of the same patient compared over time -
; see serial_ctdna.py. Active only when sample.tsv has a COLLECTION_DATE
; column (YYYY-MM-DD or DD/MM/YYYY; kept in the study's service/ folder,
; never in cBioPortal's files, which get days from the first sample).
; Optional BASELINE column (yes) marks a patient's baseline plasma sample;
; otherwise the earliest one. Research use only. Every key below falls
; back to the value shown when left blank.
ENABLED = True
; ctDNA level of a sample: "max" (maximum VAF, used by ctMoniTR) or "mean".
METRIC = max
; Molecular response vs the baseline: Decrease = drop of more than
; DECREASE_PCT %, Increase = rise of more than INCREASE_PCT %, Intermediate
; otherwise - the ctMoniTR aggregate analysis of TKI-treated NSCLC (Clin
; Cancer Res 2025;31(11):2162); a 50% drop is also the ctMoniTR cut-off for
; immunotherapy (Vega 2022, JCO Precis Oncol, doi:10.1200/PO.21.00372).
DECREASE_PCT = 50
INCREASE_PCT = 20
; Leave clonal hematopoiesis variants (CH confirmed/suspected, [CH]) out of
; the ctDNA level.
EXCLUDE_CH = True
; Germline-like VAF bands left out of the ctDNA level.
GERMLINE_VAF_BANDS = [[0.45, 0.55], [0.90, 1.0]]
; Known acquired-resistance mutations, with therapy and references.
; Relative to Varan's folder.
RESISTANCE_LIST = resistance_mutations.tsv

[GenePanel]
; Optional - all blank keeps Varan working exactly as before (a warning
; says what that leaves out). Which gene panel this run's samples were
; tested with, per data type, as the panel id (stable_id) loaded in your
; cBioPortal instance - e.g. TSO500_DNA / TSO500_RNA / GUARDANT360_CDX.
; Varan then writes data_gene_panel_matrix.txt, so cBioPortal counts a
; gene's alteration frequency only over the samples whose panel has it,
; and marks the others "not profiled" - needed for correct statistics
; once studies from different assays are merged. Every panel id used
; must be loaded in cBioPortal before importing the study. See
; gene_panels.py.
MUTATIONS =
CNA =
SV =
; Optional folder of plain gene lists, one per panel, named
; <panel id>.txt (one HUGO symbol per line). With it, Varan also exports
; each panel in cBioPortal's format (study's service/gene_panels/, for
; the portal admin) and warns about events outside a sample's panel.
PANEL_DIR =
