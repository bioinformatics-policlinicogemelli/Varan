[Vendor]
; Which pipeline produced the raw input passed via -i/--varan_input. This
; is conf.ini-only - there is no CLI flag for it. Blank/absent = unspecified/
; legacy (Varan's own sample.tsv/patient.tsv/[fusion.tsv] or an already-
; shaped SNV/CNV/CombinedOutput folder, [Sample_Type] TYPE used as-is).
; "illumina_solid"/"illumina_liquid" name Varan's own two built-in TSO500
; ingestion variants explicitly and also auto-fill/assert [Sample_Type]
; TYPE. A registered vendor name (e.g. "guardant") runs that vendor's
; preprocessing adapter against -i's raw input automatically - see
; vendor_adapters/__init__.py and MULTIVENDOR_INTEGRATION_NOTES.md.
PIPELINE =

[Sample_Type]
; Solid or Liquid. Independent of [Vendor] PIPELINE above UNLESS PIPELINE
; is set to illumina_solid/illumina_liquid/guardant (or any other vendor
; with a fixed, known sample type) - in that case this can be left blank
; and PIPELINE fills it in automatically; if both are set, they must
; agree, or varan.py raises a clear error instead of silently picking one.
TYPE =

