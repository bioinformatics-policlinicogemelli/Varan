[Paths]
VCF2MAF = /mskcc-vcf2maf/vcf2maf.pl
CLINV = /clinvar/clinvar.vcf.gz,ClinVar,vcf,exact,0,CLNSIG
REF_FASTA = test_folder/genomes/genome.fa
VEP_PATH = /opt/vep/src/ensembl-vep
VEP_DATA = test_folder/vep_cache/homo_sapiens_vep_111_GRCh37
CACHE = 111
; Rscript executable used to run SigMA (run_sigma.R), only invoked when
; -g/--sigma is passed on the CLI. Override if R isn't on PATH under the
; plain "Rscript" name.
RSCRIPT = Rscript

[Sample_Type]
TYPE = Liquid

[Multiple]
SNV=
CNV=
COMBOUT=

[Zip]
ZIP_MAF = True
ZIP_SNV_FILTERED = True
COPY_MAF = True

[OncoKB]
ONCOKB=

[Project]
PROJECT_ID =
PROJECT_NAME =
DESCRIPTION='Comprehensive profiling of cancer samples'
PROFILE_MUT="Sequencing of tumor"
PROFILE_CNA=
PROFILE_CNA_HG19="Somatic CNA data"
PROFILE_SV=

[Filters]
t_VAF_min=0.05
t_VAF_max=1
t_VAF_min_novel=0.05
; One or more [min, max] VAF bands to exclude (closed intervals), used by
; the new 'g' filter flag - independent of t_VAF_min/t_VAF_max above.
; Empty list = no-op, safe default. Typical use: scrubbing germline
; heterozygous/homozygous VAF clusters (e.g. [[0.45,0.55],[0.90,1.0]]) out
; of a tumor-only sample before mutational-signature analysis - see SigMA
; section/branch, not meant to replace the general pancancer min-VAF used
; elsewhere.
VAF_EXCLUDE_BANDS=[]
AF=<0.0004
drop_NA_AF = False
ONCOKB_FILTER_SNV=["Likely Oncogenic","Oncogenic"]
CLIN_SIG=["benign", "likely_benign", "benign/likely_benign"]
CONSEQUENCES=["splice_region_variant", "frameshift_variant", "splice_donor_variant", "stop_gained", "splice_acceptor_variant", "start_lost","inframe_insertion", "inframe_deletion"]
POLYPHEN=["damaging"]
IMPACT=["LOW", "MODIFIER"]
SIFT=["tolerated"]

[Cna]
PLOIDY = 2
CNVKIT_algorithm = True
ONCOKB_FILTER_CNV=["Likely Oncogenic","Oncogenic"]

[TMB]
THRESHOLD_TMB= {'Low':'<=5','Medium':'<10','High':'>=10'}

[MSI]
THRESHOLD_SITES=>=40
THRESHOLD_MSI=<20
THRESHOLD_MSI_LIQUID = 0.05

[FUSION]
THRESHOLD_FUSION=>=15
ONCOKB_FILTER_FUSION=["Likely Oncogenic","Oncogenic"]

[SPLICE]
THRESHOLD_SPLICE=>=15

[ClinicalSample]
HEADER_SAMPLE_SHORT =
HEADER_SAMPLE_LONG =
HEADER_SAMPLE_TYPE =

[ClinicalPatient]
HEADER_PATIENT_SHORT =
HEADER_PATIENT_LONG =
HEADER_PATIENT_TYPE =

[Annotations]
ANNOTATIONS = []

[SigMA]
; Whether SigMA runs at all is controlled ONLY by the -g/--sigma CLI flag,
; not by a conf.ini key. Deliberately no RUN_SIGMA here (the original
; feasibility report's draft proposed one) - a CLI flag AND a conf.ini
; toggle would be two sources of truth that can disagree (e.g. -g passed
; but RUN_SIGMA=False in conf.ini, or vice versa). Per the user's explicit
; direction: activation is a CLI flag, everything below is *parameters*
; for that run, not a second on/off switch.
;
; Dedicated filtering subsection for the MAF fed to SigMA - deliberately
; separate from [Filters]' t_VAF_min/t_VAF_max (tuned for the general
; pancancer clinical MAF: 0.03 solid / 0.001 liquid) since SigMA's own
; sensible values are different (per the user, VAF exclusion bands around
; ~0.5 and ~1.0 to scrub germline heterozygous/homozygous clusters out of
; a tumor-only sample, not a single pancancer minimum). Not yet wired to a
; per-SAMPLE_TYPE (solid/liquid) split the way THRESHOLD_MSI_LIQUID is -
; open question, see sigma_filter.py.
VAF_MIN = 0.0
VAF_EXCLUDE_BANDS = [[0.45, 0.55], [0.90, 1.0]]
; SigMA run() parameters - see sigma_filter.py / sigma_cancer_type_map.py.
; data="msk" is SigMA's own documented baseline for panels >300 genes.
DATA_PLATFORM = msk
CHECK_MSI = False
; SigMA's own run(snv_cutoff=...) floor - samples whose SigMA-filtered MAF
; (see sigma_filter.prepare_sigma_maf) has fewer SNVs than this are
; skipped (logged, not an error - this is the expected, common case: the
; clinical validation paper found ~25% of real panel samples fall short).
; SigMA's own internal default varies by tumor type/platform (e.g. 4 for
; a ~360-gene panel, 5 for MSK-IMPACT-like) - tune for your own panel size
; rather than inherit an unrelated lab's default.
SNV_CUTOFF = 5
; Manual override of the automatic ONCOTREE_CODE -> SigMA tumor_type
; mapping (sigma_cancer_type_map.get_sigma_call_params). Empty = use the
; automatic per-sample mapping. Set to force every sample in this run to
; one SigMA tumor_type (e.g. a single-cancer-type cohort/validation run).
TUMOR_TYPE_OVERRIDE =
; Exposes get_sigma_call_params()'s fallback_to_other argument. If True
; (default), a sample whose ONCOTREE_CODE isn't in ONCOTREE_TO_SIGMA is
; still run through SigMA's generic "other" pan-cancer model. If False,
; that sample is excluded from SigMA entirely instead.
FALLBACK_TO_OTHER = True
; SigMA's required run(catalog_name=...) argument, in the friendly form
; used in SigMA's own "Parameter choices" wiki page: "v2" resolves to
; "cosmic_v2_inhouse" (the catalog SigMA's own docs recommend for Sig3/MVA
; prediction - COSMIC v2 catalog plus WGS-discovered signatures not in the
; official catalog) and "v3p2" resolves to "cosmic_v3p2_inhouse". Any
; value already starting with "cosmic_" is passed through to SigMA
; unchanged, for a lab that wants a non-"_inhouse" catalog. Pinned
; explicitly rather than left to whatever SigMA's own default is, so a
; future SigMA version bump can't silently change which catalog is used.
COSMIC_VERSION = v2
; Condensed vs. full SigMA output. True keeps just the summary
; categ/score columns (recommended for anything surfaced to a clinician-
; facing report); False keeps every Signature_3_c{N}_ml per-cluster
; likelihood column too (useful for QC/debugging, noisy for a report).
LITE_FORMAT = True
; What "Signature-3 positive" means for Varan's own clinical columns
; (see write_clinical_sample() in walk.py). "default" uses SigMA's own
; built-in pass_mva/pass_mva_strict cutoffs on Signature_3_mva unmodified
; (recommended starting point - these are the cutoffs published/validated
; in the SigMA papers). A numeric value overrides with a lab-chosen cutoff
; on the same Signature_3_mva column instead - per SigMA's own guidance,
; this is an explicitly-supported thing to tune, not a hack.
SIGNATURE3_POSITIVE_THRESHOLD = default