[Paths]
VCF2MAF = /mskcc-vcf2maf/vcf2maf.pl
CLINV = /clinvar/clinvar.vcf.gz,ClinVar,vcf,exact,0,CLNSIG
REF_FASTA = test_folder/genomes/genome.fa
VEP_PATH = /opt/vep/src/ensembl-vep
VEP_DATA = test_folder/vep_cache/homo_sapiens_vep_111_GRCh37
CACHE = 111
; Processes VEP runs per sample (vcf2maf --vep-forks; default 4). Under
; Snakemake each sample's SNV job also reserves this many cores.
VEP_FORKS = 4
; Rscript executable used to run SigMA (run_sigma.R), only invoked when
; -g/--sigma is passed on the CLI. Override if R isn't on PATH under the
; plain "Rscript" name.
RSCRIPT = Rscript

[Vendor]
; Which pipeline produced the raw input passed via -i/--varan_input. This
; is the ONLY place vendor selection is set - there is no CLI flag for
; it, by design (see varan.py's resolve_pipeline()), so a future GUI can
; render this as a single dropdown of known, supported values.
;
; Recognized values:
;   (blank/absent) - unspecified/legacy: -i already points at Varan's own
;     sample.tsv/patient.tsv/[fusion.tsv] files, or an already-shaped
;     SNV/CNV/CombinedOutput folder - today's existing, unchanged
;     behavior. [Sample_Type] TYPE below is used exactly as configured,
;     with no cross-checking against PIPELINE.
;   illumina_solid / illumina_liquid - same no-adapter input shape as
;     blank, but names Varan's two real, pre-existing built-in ingestion
;     variants explicitly (Illumina TSO500 solid-tumor vs. TSO500 ctDNA/
;     liquid-biopsy - see README.md's "TSO500-aware" feature and
;     walk.py's own "non-Illumina pipelines (e.g. Guardant)"/"native
;     TSO500 CombinedOutput ingestion" comments, which already use this
;     exact vocabulary). Choosing one of these ALSO asserts/auto-fills
;     [Sample_Type] TYPE (Solid/Liquid respectively) - see
;     varan.reconcile_sample_type() - so you no longer need to set TYPE
;     independently when using one of these two.
;   a registered vendor name (see vendor_adapters/__init__.py's ADAPTERS
;     registry, e.g. "guardant") - runs that vendor's preprocessing
;     adapter against -i's raw input automatically (a run folder/S3
;     folder, or a local samplesheet - see MULTIVENDOR_INTEGRATION_NOTES.md),
;     instead of running create_Varan_input.py by hand first. Also
;     asserts/auto-fills [Sample_Type] TYPE from the vendor's own known
;     sample type, if it has one (Guardant360 is ctDNA-only, so
;     PIPELINE=guardant implies TYPE=Liquid).
PIPELINE =

; Per-vendor optional overrides, one section per vendor named
; [Vendor.<name>], only read when that vendor is selected above. Any key
; here is passed straight through as a keyword argument to that vendor's
; vendor_adapters/<name>.py run() function, overriding varan.py's own
; scratch-folder defaults (report_base_dir/vcf_base_dir/temp_local_dir) -
; useful for pinning a non-default dict.csv path, or for keeping
; converted intermediate files around instead of the default
; scratch-then-delete behavior. Left commented out: every key below
; already has a working default in guardant.py.
; [Vendor.guardant]
; dict_path = /path/to/dict.csv
; report_base_dir = /path/to/persistent/sample_tsv_reports
; vcf_base_dir = /path/to/persistent/converted_vcfs
; temp_local_dir = /path/to/local/tmp

[Sample_Type]
; Tissue or Plasma: the specimen type of this run's samples ("Solid" and
; "Liquid", the older values, still work: Solid = Tissue, Liquid = Plasma).
; sample.tsv's optional SPECIMEN_TYPE column overrides it per sample (blank
; cells keep this value), e.g. for tissue and plasma samples of the same
; patients - every sample's type ends up in data_clinical_sample.txt.
; Independent of [Vendor] PIPELINE above UNLESS PIPELINE is set to
; illumina_solid (Tissue) / illumina_liquid (Plasma) / guardant (Plasma) -
; then this can be left blank and PIPELINE fills it in; if both are set
; they must agree, and no sample may contradict PIPELINE either, or
; varan.py stops with a clear error.
;
; Settings that differ between tissue and plasma samples can be overridden
; per type with a "<section>.Tissue" / "<section>.Plasma" section, for
; [Filters], [MSI], [TMB], [SigMA] and [GenePanel]: each sample uses its
; type's value when that section sets the key, the general one otherwise.
; E.g.:
;   [Filters.Plasma]
;   t_VAF_min = 0.001
;   [MSI.Plasma]
;   THRESHOLD_MSI = <0.05
;   [GenePanel.Plasma]
;   MUTATIONS = GUARDANT360_CDX
TYPE = Plasma

[Multiple]
SNV=
CNV=
COMBOUT=

[Zip]
ZIP_MAF = True
ZIP_SNV_FILTERED = True
COPY_MAF = True

[OncoKB]
ONCOKB=

[Project]
PROJECT_ID =
PROJECT_NAME =
DESCRIPTION='Comprehensive profiling of cancer samples'
PROFILE_MUT="Sequencing of tumor"
PROFILE_CNA=
PROFILE_CNA_HG19="Somatic CNA data"
PROFILE_SV=

[Filters]
t_VAF_min=0.05
t_VAF_max=1
t_VAF_min_novel=0.05
; One or more [min, max] VAF bands to exclude (closed intervals), used by
; the new 'g' filter flag - independent of t_VAF_min/t_VAF_max above.
; Empty list = no-op, safe default. Typical use: scrubbing germline
; heterozygous/homozygous VAF clusters (e.g. [[0.45,0.55],[0.90,1.0]]) out
; of a tumor-only sample before mutational-signature analysis - see SigMA
; section/branch, not meant to replace the general pancancer min-VAF used
; elsewhere.
VAF_EXCLUDE_BANDS=[]
AF=<0.0004
drop_NA_AF = False
ONCOKB_FILTER_SNV=["Likely Oncogenic","Oncogenic"]
CLIN_SIG=["benign", "likely_benign", "benign/likely_benign"]
CONSEQUENCES=["splice_region_variant", "frameshift_variant", "splice_donor_variant", "stop_gained", "splice_acceptor_variant", "start_lost","inframe_insertion", "inframe_deletion"]
POLYPHEN=["damaging"]
IMPACT=["LOW", "MODIFIER"]
SIFT=["tolerated"]

[Cna]
PLOIDY = 2
CNVKIT_algorithm = True
ONCOKB_FILTER_CNV=["Likely Oncogenic","Oncogenic"]

[TMB]
THRESHOLD_TMB= {'Low':'<=5','Medium':'<10','High':'>=10'}

[MSI]
THRESHOLD_SITES=>=40
THRESHOLD_MSI=<20
; Plasma samples from a TSO500 CombinedOutput: Unstable at or above this.
; Older form of [MSI.Plasma] THRESHOLD_MSI (which wins when set).
THRESHOLD_MSI_LIQUID = 0.05

[FUSION]
THRESHOLD_FUSION=>=15
ONCOKB_FILTER_FUSION=["Likely Oncogenic","Oncogenic"]

[SPLICE]
THRESHOLD_SPLICE=>=15

[ClinicalSample]
HEADER_SAMPLE_SHORT =
HEADER_SAMPLE_LONG =
HEADER_SAMPLE_TYPE =

[ClinicalPatient]
HEADER_PATIENT_SHORT =
HEADER_PATIENT_LONG =
HEADER_PATIENT_TYPE =

[Annotations]
ANNOTATIONS = []

[SigMA]
; Whether SigMA runs at all is controlled ONLY by the -g/--sigma CLI flag,
; not by a conf.ini key. Deliberately no RUN_SIGMA here (the original
; feasibility report's draft proposed one) - a CLI flag AND a conf.ini
; toggle would be two sources of truth that can disagree (e.g. -g passed
; but RUN_SIGMA=False in conf.ini, or vice versa). Per the user's explicit
; direction: activation is a CLI flag, everything below is *parameters*
; for that run, not a second on/off switch.
;
; Dedicated filtering subsection for the MAF fed to SigMA - deliberately
; separate from [Filters]' t_VAF_min/t_VAF_max (tuned for the general
; pancancer clinical MAF: 0.03 solid / 0.001 liquid) since SigMA's own
; sensible values are different (per the user, VAF exclusion bands around
; ~0.5 and ~1.0 to scrub germline heterozygous/homozygous clusters out of
; a tumor-only sample, not a single pancancer minimum). Not yet wired to a
; per-SAMPLE_TYPE (solid/liquid) split the way THRESHOLD_MSI_LIQUID is -
; open question, see sigma_filter.py.
VAF_MIN = 0.0
VAF_EXCLUDE_BANDS = [[0.45, 0.55], [0.90, 1.0]]
; SigMA run() parameters - see sigma_filter.py / sigma_cancer_type_map.py.
; data="msk" is SigMA's own documented baseline for panels >300 genes.
DATA_PLATFORM = msk
CHECK_MSI = False
; SigMA's own run(snv_cutoff=...) floor - samples whose SigMA-filtered MAF
; (see sigma_filter.prepare_sigma_maf) has fewer SNVs than this are
; skipped (logged, not an error - this is the expected, common case: the
; clinical validation paper found ~25% of real panel samples fall short).
; SigMA's own internal default varies by tumor type/platform (e.g. 4 for
; a ~360-gene panel, 5 for MSK-IMPACT-like) - tune for your own panel size
; rather than inherit an unrelated lab's default.
SNV_CUTOFF = 5
; Manual override of the automatic ONCOTREE_CODE -> SigMA tumor_type
; mapping (sigma_cancer_type_map.get_sigma_call_params). Empty = use the
; automatic per-sample mapping. Set to force every sample in this run to
; one SigMA tumor_type (e.g. a single-cancer-type cohort/validation run).
TUMOR_TYPE_OVERRIDE =
; Exposes get_sigma_call_params()'s fallback_to_other argument. If True
; (default), a sample whose ONCOTREE_CODE isn't in ONCOTREE_TO_SIGMA is
; still run through SigMA's generic "other" pan-cancer model. If False,
; that sample is excluded from SigMA entirely instead.
FALLBACK_TO_OTHER = True
; SigMA's required run(catalog_name=...) argument, in the friendly form
; used in SigMA's own "Parameter choices" wiki page: "v2" resolves to
; "cosmic_v2_inhouse" (the catalog SigMA's own docs recommend for Sig3/MVA
; prediction - COSMIC v2 catalog plus WGS-discovered signatures not in the
; official catalog) and "v3p2" resolves to "cosmic_v3p2_inhouse". Any
; value already starting with "cosmic_" is passed through to SigMA
; unchanged, for a lab that wants a non-"_inhouse" catalog. Pinned
; explicitly rather than left to whatever SigMA's own default is, so a
; future SigMA version bump can't silently change which catalog is used.
COSMIC_VERSION = v2
; Condensed vs. full SigMA output. True keeps just the summary
; categ/score columns (recommended for anything surfaced to a clinician-
; facing report); False keeps every Signature_3_c{N}_ml per-cluster
; likelihood column too (useful for QC/debugging, noisy for a report).
LITE_FORMAT = True
; What "Signature-3 positive" means for Varan's own clinical columns
; (see write_clinical_sample() in walk.py). "default" uses SigMA's own
; built-in pass_mva/pass_mva_strict cutoffs on Signature_3_mva unmodified
; (recommended starting point - these are the cutoffs published/validated
; in the SigMA papers). A numeric value overrides with a lab-chosen cutoff
; on the same Signature_3_mva column instead - per SigMA's own guidance,
; this is an explicitly-supported thing to tune, not a hack.
SIGNATURE3_POSITIVE_THRESHOLD = default

[CH]
; Flags plasma variants that may come from clonal hematopoiesis (white
; blood cell clones, not the tumor) - see clonal_hematopoiesis.py. Plasma
; samples only; variants are flagged in data_mutations_extended.txt
; (CH.EVIDENCE, CH.REASON), never removed. Without sequencing of matched
; white blood cells (sample.tsv's optional wbc_path column, a VCF) the
; origin can't be confirmed: research use only.
ENABLED = True
; Genes/variants typical of clonal hematopoiesis (tier 1) or shared with
; tumors (tier 2), with their sources. Relative to Varan's folder.
GENE_LIST = ch_genes.tsv
; A tier 2 variant counts as "CH suspected" (instead of "CH compatible")
; when its VAF is below this fraction of the highest VAF among the
; sample's variants in genes outside GENE_LIST - or with the next one.
; Heuristics, not validated against white blood cell sequencing.
RELATIVE_VAF_MAX = 0.25
; ...or when, across the patient's plasma samples, its VAF changes less
; than SERIAL_FOLD times while their tumor VAF changes at least as much.
SERIAL_FOLD = 2
; True: suspected/confirmed CH variants are left out of SigMA's input.
EXCLUDE_FROM_DOWNSTREAM = False

[Serial]
; Serial ctDNA: plasma samples of the same patient compared over time -
; see serial_ctdna.py. Active only when sample.tsv has a COLLECTION_DATE
; column (YYYY-MM-DD or DD/MM/YYYY; kept in the study's service/ folder,
; never in cBioPortal's files, which get days from the first sample).
; Optional BASELINE column (yes) marks a patient's baseline plasma sample;
; otherwise the earliest one. Research use only. Every key below falls
; back to the value shown when left blank.
ENABLED = True
; ctDNA level of a sample: "max" (maximum VAF, used by ctMoniTR) or "mean".
METRIC = max
; Molecular response vs the baseline: Decrease = drop of more than
; DECREASE_PCT %, Increase = rise of more than INCREASE_PCT %, Intermediate
; otherwise - the ctMoniTR aggregate analysis of TKI-treated NSCLC (Clin
; Cancer Res 2025;31(11):2162); a 50% drop is also the ctMoniTR cut-off for
; immunotherapy (Vega 2022, JCO Precis Oncol, doi:10.1200/PO.21.00372).
DECREASE_PCT = 50
INCREASE_PCT = 20
; Leave clonal hematopoiesis variants (CH confirmed/suspected, [CH]) out of
; the ctDNA level.
EXCLUDE_CH = True
; Germline-like VAF bands left out of the ctDNA level.
GERMLINE_VAF_BANDS = [[0.45, 0.55], [0.90, 1.0]]
; Known acquired-resistance mutations, with therapy class and references.
; Relative to Varan's folder. With treatments.tsv ([Timeline]) a match is
; flagged only for patients who received a treatment of its class, and the
; response baseline is the last plasma sample before the treatment starts.
RESISTANCE_LIST = resistance_mutations.tsv

[Timeline]
; Clinical timeline - see clinical_timeline.py. Optional treatments.tsv,
; one row per event: PATIENT_ID, EVENT_TYPE (TREATMENT or STATUS),
; START_DATE, STOP_DATE (treatments; blank = ongoing), AGENT, THERAPY_CLASS
; (from therapy_classes.tsv), LINE, STATUS (Progression / Response /
; Death), RECIST (CR/PR/SD/PD, required for Response). Optional
; DIAGNOSIS_DATE column in patient.tsv: day 0 is the diagnosis when every
; patient has one, otherwise each patient's first event. Dates stay in the
; study's service/ folder; cBioPortal gets days.
; Path to treatments.tsv; blank = treatments.tsv next to patient.tsv, else
; next to sample.tsv (or in the input folder).
TREATMENTS =

[Actionability]
; OncoKB levels (with -k) that make an alteration "actionable" for
; ONCOKB_N_ACTIONABLE and the OncoKB actionable case list - see
; actionability.py. Default 1,2 (standard care); e.g. 1,2,3A to widen.
ONCOKB_LEVELS = 1,2
; CIViC predictive evidence levels counted as actionable (A validated,
; B clinical, C case study, D preclinical, E inferential). Default A,B.
CIVIC_LEVELS = A,B

[TumorAgnostic]
; Biomarkers of tumour-agnostic approvals per sample (tumor_agnostic.tsv,
; FDA/EMA approvals and date checked) - see tumor_agnostic.py.
ENABLED = True
; TMB-H cut-off in mut/Mb (blank: the table's 10, the FDA one - validated
; on FoundationOne CDx, not harmonised with other panels' TMB).
TMB_HIGH =
; High Genomic Instability Score cut-off (blank: the table's 42).
GIS_HIGH =

[CIViC]
; CIViC clinical evidence (civicdb.org, CC0, no token) for every study -
; see civic.py. Its TSV dumps (about 5 MB) are downloaded on first use and
; reused; refresh with `python civic.py --download`. Matching takes
; seconds. Levels are for any tumour type (CIViC diseases aren't mapped to
; OncoTree); columns are separate from OncoKB's (CIVIC.*, CIVIC_*).
ENABLED = True
; Folder of the CIViC files; blank = the civic folder in Varan's.
DIR =
; Download the files when they're missing (needs the network).
AUTO_DOWNLOAD = True

[ESCAT]
; Optional ESCAT tier table curated by the lab (format: escat_template.tsv,
; see escat.py). Blank = no ESCAT annotation. Varan ships no ESCAT content.
FILE =

[GenePanel]
; Optional - all blank keeps Varan working exactly as before (a warning
; says what that leaves out). Which gene panel this run's samples were
; tested with, per data type, as the panel id (stable_id) loaded in your
; cBioPortal instance - e.g. TSO500_DNA / TSO500_RNA / GUARDANT360_CDX.
; Varan then writes data_gene_panel_matrix.txt, so cBioPortal counts a
; gene's alteration frequency only over the samples whose panel has it,
; and marks the others "not profiled" - needed for correct statistics
; once studies from different assays are merged. Every panel id used
; must be loaded in cBioPortal before importing the study. See
; gene_panels.py.
MUTATIONS =
CNA =
SV =
; Optional folder of plain gene lists, one per panel, named
; <panel id>.txt (one HUGO symbol per line). With it, Varan also exports
; each panel in cBioPortal's format (study's service/gene_panels/, for
; the portal admin) and warns about events outside a sample's panel.
PANEL_DIR =
